[pytest]
# =========================================================================== #
# Gate configuration. This repo had NO pytest config before; bare pytest
# collected 1779 tests.
#
# [!] KEEP THIS FILE PURE ASCII. pytest-xdist re-parses pytest.ini through
#   iniconfig using the *platform locale* codec, not utf-8. On a GBK locale
#   (zh-CN Windows) any non-ASCII byte here crashes collection with
#   "UnicodeDecodeError: 'gbk' codec can't decode byte ...". Comments in the
#   test files can be Chinese; this file cannot.
# =========================================================================== #

# ---- Parallel by default (pytest-xdist 3.8.0, already installed) --------- #
# Serial 385 s -> parallel 200 s. Verified that -n auto, -n 8 and
# -n auto --dist loadfile all collect and report IDENTICALLY
# (1775 passed + 4 skipped = 1779); no test is dropped by running parallel.
#
# [!] You MUST also pin BLAS/OpenMP threads to 1 (see the `set OMP_NUM_THREADS=1`
#   in the gate command in run.txt). This box is 8 physical cores / 14 GB and
#   every worker spins up its own torch thread pool, so 16 workers fight over
#   the cores and individual tests slow down 4-6x:
#     test_max_batch_respects_budget      serial 10.81 s -> parallel 115.24 s
#     test_npu_scripts_fit_memory_budget  serial  8.91 s -> parallel 105.21 s
#   With threads pinned to 1 the same config runs in 200 s. -n auto alone,
#   without pinning, is 244 s.
#
# [!] No `-m` here on purpose: the default MUST still run the `slow` tests, so
#   the full gate can never silently get weaker. The fast gate opts out
#   explicitly with `-m "not slow"` on the command line (see run.txt).
addopts = -n auto

# ---- Marker registration (unregistered => PytestUnknownMarkWarning) ------ #
markers =
    slow: Regression tests that need the real archives (the 1.5 GB pair under
          katago/stdata). The dev-time fast gate skips them with
          `-m "not slow"`; the pre-commit FULL GATE STILL RUNS THEM.
          Registering a marker does not exclude it.
